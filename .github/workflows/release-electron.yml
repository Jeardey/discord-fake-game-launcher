name: Release (Electron Installer)

on:
  push:
    tags:
      - 'release_*'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -match '^release_(\d+\.\d+\.\d+)$') {
            $version = $Matches[1]
            "version=$version" >> $env:GITHUB_OUTPUT
            Write-Host "Version: $version"
          } else {
            Write-Error "Tag '$tag' does not match release_X.Y.Z"
            exit 1
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Discord Fake Game Launcher ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: false

  build-and-release:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            dummy_tfm: net8.0-windows
            dummy_dir: dummygame-win
            dist_script: dist:publish
          - os: ubuntu-latest
            dummy_tfm: net8.0
            dummy_dir: dummygame-linux
            dist_script: dist:linux:publish

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Publish DummyGame for bundling
        run: |
          dotnet restore ./src/DummyGame/DummyGame.csproj
          dotnet publish ./src/DummyGame/DummyGame.csproj -c Release -f ${{ matrix.dummy_tfm }} -o ./electron/build-resources/${{ matrix.dummy_dir }} --no-restore

      - name: Install Electron dependencies
        run: |
          cd electron
          npm install --no-audit --no-fund

      - name: Set Electron app version
        shell: pwsh
        run: |
          $v = "${{ needs.create-release.outputs.version }}"
          Push-Location electron
          npm version $v --no-git-tag-version
          Pop-Location

      - name: Build and publish installer + latest.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd electron
          npm run ${{ matrix.dist_script }}
